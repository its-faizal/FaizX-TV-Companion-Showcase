<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-labelledby="title"><title id="title">Connect your phone to Wi-Fi, approve the TV pairing, then control the screen.</title><rect width="1200" height="180" rx="16" fill="#101a20"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><g fill="#9fe8da" font-size="14" letter-spacing="2"><text x="40" y="45">01 / DISCOVER</text><text x="440" y="45">02 / APPROVE</text><text x="840" y="45">03 / CONTROL</text></g><g fill="#f1f1f3" font-size="24" font-weight="600"><text x="40" y="90">Same Wi-Fi network.</text><text x="440" y="90">Your TV, your permission.</text><text x="840" y="90">A familiar touch.</text></g><g fill="#a7bac3" font-size="17"><text x="40" y="129">Find your screen or enter its address.</text><text x="440" y="129">Complete the TV pairing prompt.</text><text x="840" y="129">Navigate, type and adjust volume.</text></g></g><path d="M400 32v116m400-116v116" stroke="#293d47"/>
